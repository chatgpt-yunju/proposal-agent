# 写方案智能体 · Nginx 反向代理
# 放到 /etc/nginx/conf.d/proposal-agent.conf，然后 nginx -t && systemctl reload nginx
#
# 三个关键点：
#   1) SSE 流式（章节生成、前言摘要起草）必须关缓冲，否则浏览器要等全部生成完才出字
#   2) 上传模板/知识库可能有几十 MB，client_max_body_size 要放大
#   3) 整篇生成、PDF 导出耗时长，read/send timeout 要拉长

server {
    listen 80;
    server_name fangsheng.yunjunet.cn;   # 换成你的域名，没有域名就用公网 IP

    client_max_body_size 300m;

    # SSE：单独一段，彻底关掉缓冲和超时
    location ~ ^/api/(workflow/generate_chapter|projects/.*/front_matter/draft/stream|.*/stream) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

